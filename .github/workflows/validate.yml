# Checks every change to locales/ and to the scripts that check it.
#
# This workflow never writes. It reads the change it is checking and reports,
# and .github/workflows/stamp.yml is the one that stamps, on push to main.
#
# What this run does with stamps is predict them. It makes the same comparison
# the stamper makes (`--stamp-changed=<base>`, without `--stamp`), so a unit the
# change wrote and the stamper will stamp is reported as `stampable` and held
# against nobody. Every other unit with no stamp is an ERROR, because nothing
# can tie it to any English and completeness.mjs will block a source repo's PR
# on it, in a repo whose author never sees this run. The two halves are meant to
# leave no third case: either CI stamps it, or CI says so here.
#
# Which English this validates against:
#
# This repo holds no English. The two website catalogs are checked against
# exercism/website `main`, fetched blobless with no working tree and read as
# git objects (scripts/lib/git.mjs). Blob-keyed content needs no English: a
# content file is checked from its own bytes and the path it is filed under.
#
# `main` moves, and that is safe here (unlike in Jiki's repo, which this was
# forked from). A translation ahead of website main shows up as an extra key (a
# WARN) or a stale stamp (a counted state). The only way a change to website
# main can fail this run is by adding a unit that a production locale does not
# have. So there is no pin, no `English-Ref:` trailer and no baseline-relative
# gating.
#
# Pushes to main as well as PRs:
#
# Translation passes commit straight to main, so a check that only ran on PRs
# would miss most changes. A push to main deploys (the website pulls this repo
# on push and reads locales/ from its checkout), so a failure on main means a
# production locale is broken in what the website serves.

name: Validate

on:
  pull_request:
    paths:
      - "locales/**"
      - "index/**"
      - "scripts/**"
      - "locales.json"
      - "website-exclusions.json"
      - "package.json"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]
    paths:
      - "locales/**"
      - "index/**"
      - "scripts/**"
      - "locales.json"
      - "website-exclusions.json"
      - "package.json"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # The whole history, because the run compares the change against the base
      # it is measured from, the same way no-deletions.yml does.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Runs before setup-node, whose pnpm cache needs pnpm to find the store
      # path. The version comes from package.json's `packageManager` field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Installs `yaml`, the one dependency. Only the code that reads the
      # website's Rails YAML loads it.
      - name: Install
        run: pnpm install --frozen-lockfile

      # Builds its own fixture (a small website, a small track and a small copy
      # of this repo) and runs every script over it, so every script is tested
      # whatever the real locales.json lists.
      - name: Test
        run: node scripts/test.mjs

      # The index's Markdown is generated from its JSON, so a page that differs
      # from what its JSON generates was edited by hand. Also fails on an id
      # with no file under locales/.
      - name: Check the translation index
        run: node scripts/build-index.mjs all --check

      # Fetches trees, plus the blobs of the two English directories in one
      # request. There is no working tree, so no website file is written to
      # this runner.
      - name: Fetch English (exercism/website main)
        run: node scripts/source-checkout.mjs --source=website

      # Each metadata catalog (locales/<locale>/metadata/<repo>.json) is checked
      # against the English in its own repo, so every repo that some locale has
      # a catalog for is fetched too: trees only, plus the few blobs the catalog
      # is built from. If a repo cannot be fetched, its catalogs are reported as
      # `unv` (unverified) and the run does not fail.
      - name: Fetch the repos metadata catalogs translate
        id: repos
        run: |
          set -euo pipefail
          REPOS=""
          for name in $(ls locales/*/metadata/*.json 2>/dev/null | grep -v '\.meta\.json$' | xargs -n1 basename 2>/dev/null | sed 's/\.json$//' | sort -u); do
            [[ "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || continue
            case "$name" in
              problem-specifications|docs|blog) node scripts/source-checkout.mjs --source="$name" || continue ;;
              *) node scripts/source-checkout.mjs --source=track --repo="exercism/$name" || continue ;;
            esac
            REPOS="${REPOS:+$REPOS,}.source/$name"
          done
          echo "list=$REPOS" >> "$GITHUB_OUTPUT"

      # On a PR the range is merge base to head, and on a push to main the push
      # itself, as in no-deletions.yml. A push whose base this checkout does not
      # hold (a force push, a new branch) leaves nothing to compare against, and
      # then nothing is predicted: every unstamped unit is reported as one,
      # which is the safe direction.
      - name: What this change is measured against
        id: base
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --quiet origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            echo "sha=$(git merge-base "origin/$BASE_REF" HEAD)" >> "$GITHUB_OUTPUT"
          elif [ -n "$BEFORE" ] && git rev-parse --verify --quiet "$BEFORE^{commit}" > /dev/null; then
            echo "sha=$BEFORE" >> "$GITHUB_OUTPUT"
          else
            echo "No base to compare against, so no unit is reported as stampable."
          fi

      - name: Validate every locale
        env:
          CONTENT_REPOS: ${{ steps.repos.outputs.list }}
          BASE: ${{ steps.base.outputs.sha }}
        run: node scripts/validate.mjs all ${BASE:+--stamp-changed="$BASE"} ${CONTENT_REPOS:+--content-repos="$CONTENT_REPOS"}

      - name: Coverage
        if: always()
        run: node scripts/coverage.mjs
