# Close the loop: when a translation issue is closed, re-run the source PR's
# completeness check.
#
# A source repo's i18n-queue workflow opens an issue here, titled
# `Translate exercism/<repo>#<PR>: ...`, when a PR changes English. The
# translations land on main here and the issue is closed. Nothing on the source
# repo's side can see a push here, so without this the PR's red check would stay
# red until somebody noticed and re-ran it by hand. Closing the issue is the one
# event that knows the translations have landed, so it is where the re-run belongs.
#
# It re-runs the FAILED jobs of the most recent `i18n completeness` run for the
# PR's current head commit. A run that already passed, a PR that is no longer
# open, or a PR with no run yet is left alone. Looked up by head SHA and not by
# branch name, because most Exercism PRs come from forks and a fork's branch is
# very often called `main`.
#
# ## The issue is untrusted input
#
# This repo is public, so anybody can open an issue with any title, and an
# author can close their own issue. Two things bound what that can do. The job
# only runs for an issue carrying the `translation` label, which only someone
# with triage rights (or the queue's token) can apply. And the repo name is taken
# from the title through a strict pattern that can only ever name a repository in
# the `exercism` organisation. The worst a forged issue could then do is re-run an
# already-failed check on an open PR, which anyone with write access can do with
# a button.
#
# ## The token
#
# `EXERCISM_SOURCE_REPOS_ACTIONS_PAT` is a REPOSITORY secret on exercism/i18n: a
# fine-grained PAT with Actions read/write and Pull requests read on the source
# repos (website, docs, blog, website-copy, problem-specifications and the
# tracks). The default GITHUB_TOKEN is scoped to this repo and cannot re-run a
# workflow anywhere else. A source repo the PAT does not cover fails here with a
# 404 from `gh`, which is the cue to add that repo to the PAT.

name: Rerun source check

on:
  issues:
    types: [closed]

permissions: {}

jobs:
  rerun:
    if: ${{ contains(github.event.issue.labels.*.name, 'translation') && startsWith(github.event.issue.title, 'Translate exercism/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Re-run the PR's completeness check
        env:
          GH_TOKEN: ${{ secrets.EXERCISM_SOURCE_REPOS_ACTIONS_PAT }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "EXERCISM_SOURCE_REPOS_ACTIONS_PAT is not configured; nothing can be re-run. See this workflow's header."
            exit 0
          fi

          # `exercism/<name>#<digits>:` and nothing looser. The title reaches this
          # script as an environment variable and is never interpolated into it.
          if [[ ! "$TITLE" =~ ^Translate\ (exercism/[A-Za-z0-9._-]+)#([0-9]+): ]]; then
            echo "Could not read a repo and PR number from the title."
            exit 0
          fi
          REPO="${BASH_REMATCH[1]}"
          PR="${BASH_REMATCH[2]}"

          STATE=$(gh pr view "$PR" --repo "$REPO" --json state --jq '.state')
          if [ "$STATE" != "OPEN" ]; then
            echo "$REPO#$PR is $STATE; nothing to re-run."
            exit 0
          fi
          HEAD_SHA=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq '.headRefOid')

          RUN=$(gh run list --repo "$REPO" --workflow=i18n-completeness.yml --commit "$HEAD_SHA" \
            --limit 1 --json databaseId,conclusion --jq '.[0] | "\(.databaseId) \(.conclusion)"' || true)
          if [ -z "$RUN" ] || [ "$RUN" = "null null" ]; then
            echo "$REPO#$PR has no completeness run for $HEAD_SHA yet; nothing to re-run."
            exit 0
          fi

          ID=${RUN% *}
          CONCLUSION=${RUN#* }
          if [ "$CONCLUSION" != "failure" ]; then
            echo "$REPO#$PR's latest completeness run ($ID) concluded '$CONCLUSION'; leaving it."
            exit 0
          fi

          echo "Re-running failed jobs of run $ID on $REPO#$PR ($HEAD_SHA)."
          gh run rerun "$ID" --repo "$REPO" --failed
