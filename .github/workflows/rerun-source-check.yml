# Re-runs a source PR's completeness check when its translation issue is
# closed, then replies on the PR that it has been translated.
#
# A source repo's i18n-queue workflow opens an issue here, titled
# `Translate exercism/<repo>#<PR>: ...`. The translations land on main here and
# the issue is closed. The source repo cannot see pushes here, so without this
# workflow the PR's failed check would stay failed until someone re-ran it by
# hand. Closing the issue is the event that means the translations have landed.
#
# It re-runs the failed jobs of the most recent `i18n completeness` run for the
# PR's current head commit. It does nothing if that run passed, if the PR is no
# longer open, or if there is no run yet. Runs are looked up by head SHA because
# most Exercism PRs come from forks, and a fork's branch is often called `main`.
#
# After the re-run, when the issue closed as completed, it posts one reply on
# the PR: "This PR has been translated 🚀" (scripts/pr-reply.mjs), so the
# maintainer knows the PR can be merged. Every other step, including failures,
# is recorded on the i18n issue only. The reply is skipped when the PR is no
# longer open, or when the PR already has it.
#
# Issues closed as "not planned" are skipped. The source repo's i18n-queue
# workflow closes an issue that way when `ready-to-translate` is removed from
# the PR, so nothing was translated and there is nothing to re-run.
#
# Untrusted input:
#
# This repo is public, so anyone can open an issue with any title, and an
# author can close their own issue. Two things limit what that can do. Every
# job only runs for issues with the `translation` label, which only someone with
# triage rights (or the queue's token) can add. And the repo name is taken from
# the title with a strict pattern that can only match a repository in the
# `exercism` organisation. The worst a forged issue can do is re-run an
# already-failed check on an open PR, which anyone with write access can do
# with a button. Replies go further, since they post as the app, so the reply
# job also requires the issue to be opened by `exercism-i18n[bot]`, as the
# queue's issues are. Its wording is fixed, and it reads nothing from the issue but the
# title's repo and PR number and the issue's labels.
#
# Token:
#
# Each job that acts on the source repo mints a short-lived installation token
# for the Exercism i18n GitHub App with actions/create-github-app-token,
# limited to the one source repo named in the title. `rerun` gets Actions read
# and write (to re-run the check) and Pull requests read. `reply` gets Pull
# requests read and write (to read the PR's comments and post the reply). The
# app's id is the organisation variable EXERCISM_I18N_APP_ID and its private
# key the organisation secret EXERCISM_I18N_APP_PRIVATE_KEY. The app is
# installed on every repo in the organisation. The default GITHUB_TOKEN only
# covers this repo and cannot re-run a workflow or comment elsewhere.

name: Rerun source check

on:
  issues:
    types: [closed]

permissions: {}

jobs:
  # Reads the source repo and PR number from the title, for both jobs below.
  pr:
    if: ${{ contains(github.event.issue.labels.*.name, 'translation') && startsWith(github.event.issue.title, 'Translate exercism/') && github.event.issue.state_reason != 'not_planned' }}
    runs-on: ubuntu-latest
    outputs:
      repo: ${{ steps.title.outputs.repo }}
      number: ${{ steps.title.outputs.number }}
    steps:
      - name: Read the repo and PR number from the title
        id: title
        env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          # Accept only `exercism/<name>#<digits>:`. The title is passed in as an
          # environment variable and never interpolated into the script.
          if [[ ! "$TITLE" =~ ^Translate\ (exercism/[A-Za-z0-9._-]+)#([0-9]+): ]]; then
            echo "Could not read a repo and PR number from the title."
            exit 0
          fi
          echo "repo=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "number=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"

  rerun:
    needs: pr
    if: ${{ github.event.action == 'closed' && needs.pr.outputs.repo != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Mint a token for the source repo
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.EXERCISM_I18N_APP_ID }}
          private-key: ${{ secrets.EXERCISM_I18N_APP_PRIVATE_KEY }}
          owner: exercism
          repositories: ${{ needs.pr.outputs.repo }}
          permission-actions: write
          permission-pull-requests: read

      - name: Re-run the PR's completeness check
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ needs.pr.outputs.repo }}
          PR: ${{ needs.pr.outputs.number }}
        run: |
          set -euo pipefail

          STATE=$(gh pr view "$PR" --repo "$REPO" --json state --jq '.state')
          if [ "$STATE" != "OPEN" ]; then
            echo "$REPO#$PR is $STATE; nothing to re-run."
            exit 0
          fi
          HEAD_SHA=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq '.headRefOid')

          RUN=$(gh run list --repo "$REPO" --workflow=i18n-completeness.yml --commit "$HEAD_SHA" \
            --limit 1 --json databaseId,conclusion --jq '.[0] | "\(.databaseId) \(.conclusion)"' || true)
          if [ -z "$RUN" ] || [ "$RUN" = "null null" ]; then
            echo "$REPO#$PR has no completeness run for $HEAD_SHA yet; nothing to re-run."
            exit 0
          fi

          ID=${RUN% *}
          CONCLUSION=${RUN#* }
          if [ "$CONCLUSION" != "failure" ]; then
            echo "$REPO#$PR's latest completeness run ($ID) concluded '$CONCLUSION'; leaving it."
            exit 0
          fi

          echo "Re-running failed jobs of run $ID on $REPO#$PR ($HEAD_SHA)."
          gh run rerun "$ID" --repo "$REPO" --failed

  reply:
    # Waits until the check has been re-run.
    needs: [pr, rerun]
    if: ${{ needs.pr.outputs.repo != '' && github.event.issue.user.login == 'exercism-i18n[bot]' && github.event.issue.state_reason == 'completed' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - name: Check out this repo (scripts only)
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            locales.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Mint a token for the source repo
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.EXERCISM_I18N_APP_ID }}
          private-key: ${{ secrets.EXERCISM_I18N_APP_PRIVATE_KEY }}
          owner: exercism
          repositories: ${{ needs.pr.outputs.repo }}
          permission-pull-requests: write

      - name: Reply on the PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ needs.pr.outputs.repo }}
          PR: ${{ needs.pr.outputs.number }}
        run: |
          set -euo pipefail

          [[ "$ISSUE" =~ ^[1-9][0-9]*$ && "$PR" =~ ^[1-9][0-9]*$ ]] || { echo "Not an issue and PR number; no reply."; exit 0; }

          KIND=translated

          if ! STATE=$(gh pr view "$PR" --repo "$REPO" --json state --jq '.state'); then
            echo "::warning::Could not read ${REPO}#${PR}, so no reply was posted."
            exit 0
          fi
          if [ "$STATE" != "OPEN" ]; then
            echo "${REPO}#${PR} is ${STATE}; no reply."
            exit 0
          fi

          if ! gh api --paginate "repos/${REPO}/issues/${PR}/comments?per_page=100" --jq '.[].body | @json' > comments.jsonl; then
            echo "::warning::Could not read the comments on ${REPO}#${PR}, so no reply was posted."
            exit 0
          fi
          POST=$(node scripts/pr-reply.mjs "$KIND" --issue="$ISSUE" --out=reply.md --comments=comments.jsonl)
          if [ "$POST" != "post=true" ]; then
            echo "${REPO}#${PR} already has this reply (${KIND}); not posting it again."
            exit 0
          fi
          if ! gh api "repos/${REPO}/issues/${PR}/comments" -F body=@reply.md > /dev/null; then
            echo "::warning::Could not reply on ${REPO}#${PR}. The app needs Pull requests read and write on ${REPO}."
            exit 0
          fi
          echo "Replied on ${REPO}#${PR} (${KIND})."
