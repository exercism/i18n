# Sends a translation issue to exercism/translator.
#
# A source repo's i18n-queue workflow opens (or updates) an issue here, and
# this workflow tells the translator repo that the issue is waiting. No script
# in this repo calls an LLM. The translator pushes the translations to main
# here and closes the issue, which re-runs the source PR's completeness check
# (rerun-source-check.yml).
#
# It makes one repository_dispatch call carrying only the issue number. The
# translator repo reads the issue itself and applies its own checks, so the
# payload cannot change what it does.
#
# It runs on `edited` as well as `opened`, because the queue updates an open
# issue in place with a newer sha (after a push that changed no English, or
# when the label is added again while the issue is still open), and the newer
# sha is the one to translate.
#
# Untrusted input:
#
# This repo is public, so anyone can open an issue with any title, body or
# label they are allowed to add, as in rerun-source-check.yml. Three things
# limit what that can do, and none of the issue's text is sent:
#
#  - The job only runs for an issue opened by iHiD (the owner of the PAT the
#    source repos' workflows use), with the `translation` label, and titled
#    `Translate exercism/...`. Only someone with triage rights can add the
#    label.
#  - Only the issue number is sent. It is checked here as digits, and checked
#    again by the translator repo, which fetches the issue itself and applies
#    its own checks (author, label, an allowlisted repo, and a sha that belongs
#    to that PR) before translating anything.
#  - The title and body are never passed to the script and never sent
#    anywhere.
#
# Token:
#
# `EXERCISM_TRANSLATOR_DISPATCH_PAT` is a repository secret here: a
# fine-grained PAT with Contents read/write on exercism/translator and nothing
# else, which is what `POST /repos/{owner}/{repo}/dispatches` requires. The
# default GITHUB_TOKEN only covers this repo and cannot dispatch elsewhere.

name: Translate on issue

on:
  issues:
    types: [opened, edited]

permissions: {}

jobs:
  dispatch:
    if: ${{ github.event.issue.user.login == 'iHiD' && contains(github.event.issue.labels.*.name, 'translation') && startsWith(github.event.issue.title, 'Translate exercism/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch translate-issue to exercism/translator
        env:
          GH_TOKEN: ${{ secrets.EXERCISM_TRANSLATOR_DISPATCH_PAT }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "EXERCISM_TRANSLATOR_DISPATCH_PAT is not configured; nothing was dispatched. See this workflow's header."
            exit 0
          fi

          # Digits only. The number is the only thing sent, and jq builds the
          # JSON payload from it.
          if [[ ! "$ISSUE" =~ ^[1-9][0-9]{0,8}$ ]]; then
            echo "::error::Not an issue number."
            exit 1
          fi

          jq -n --argjson issue "$ISSUE" '{event_type: "translate-issue", client_payload: {issue: $issue}}' \
            | gh api -X POST repos/exercism/translator/dispatches --input -

          echo "Dispatched translate-issue for #${ISSUE}."
