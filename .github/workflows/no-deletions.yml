# Fails a change that removes a file or a key under locales/.
#
# Translation runs ahead of English merging, and every repo that holds English
# checks its PRs against what this repo holds. So this repo has to hold
# translations for the English on every source repo's main branch and on all of
# their open PRs at once. A pass that drops the keys one PR renamed away breaks
# website main as soon as it lands. Blob-keyed content never goes out of date,
# so there is no reason to remove any of it. Extra keys are never an error
# here, so the rule is simple: add and update, never delete.
# scripts/no-deletions.mjs has the full reasoning, and the `Allow-Deletions:`
# trailer for removals that are correct.
#
# On a PR the range is merge base to head. On a push to main it is the push
# itself (`before`..`after`), because translation passes commit straight to
# main. A failure on main is a real regression; fix it by restoring the keys.

name: No deletions

on:
  pull_request:
    paths:
      - "locales/**"
      - ".github/workflows/no-deletions.yml"
      - "scripts/no-deletions.mjs"
  push:
    branches: [main]
    paths:
      - "locales/**"
      - ".github/workflows/no-deletions.yml"
      - "scripts/no-deletions.mjs"

jobs:
  no-deletions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check nothing was removed
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --quiet origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            BASE=$(git merge-base "origin/$BASE_REF" HEAD)
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            BASE="$BEFORE"
          else
            echo "No base to compare against (new branch); nothing to check."
            exit 0
          fi
          node scripts/no-deletions.mjs --base="$BASE" --head=HEAD
