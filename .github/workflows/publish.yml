# The only thing that writes to S3.
#
# Every route into this repo ends at a commit on main: a translation pass commits
# there, a human merges a PR there. So publishing on push to main means there is
# exactly one publish path, and exactly one writer for every pointer.
#
# ## What is real today, and what is not
#
# Building `dist/` is real and runs on every push. UPLOADING is switched off until
# the repo has an `I18N_BUCKET` variable, because bucket names, credentials and
# IAM are an open decision (see CLAUDE.md, "Open questions"). Until then this
# workflow proves the build and uploads the tree as a workflow artifact so it can
# be inspected. Nothing here guesses a bucket.
#
# TODO(iHiD): when the bucket exists, set the `I18N_BUCKET` repository variable
# and give this job credentials. Prefer GitHub OIDC with an IAM role scoped to
# `s3://<bucket>/i18n/*` (`aws-actions/configure-aws-credentials` with
# `role-to-assume`, and `id-token: write` below) over long-lived keys in secrets.
#
# TODO(iHiD): OPEN. What mirrors S3 to EFS for Rails is undecided and nothing
# here triggers it. If the mirror needs a nudge rather than polling the pointers,
# this job is where the nudge goes, AFTER the upload step.

name: Publish

on:
  push:
    branches: [main]
    paths:
      - "locales/**"
      - "scripts/**"
      - "locales.json"
      - ".github/workflows/publish.yml"

# Artifacts are immutable and content-hashed, so two runs uploading the same bytes
# is harmless. Pointers are not: they are the one mutable object, and two runs
# flipping them in either order could leave a pointer naming an older artifact than
# the commit that ran last. Serialise, and never cancel a run mid-upload.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Depth 2 so `--changed-since` has the previous commit to diff against
          # on an ordinary push. A push of several commits falls back to a full
          # content upload below, which is slower and never wrong.
          fetch-depth: 2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Fetch English (exercism/website main)
        run: node scripts/source-checkout.mjs --source=website

      # ENFORCED, unlike in Jiki's repo. There, publishing is permissive because a
      # review site is the only place a translator can see work in progress. Here
      # there is no review site, what is published is what production serves, and
      # a catalog with a broken `%{placeholder}` raises in Rails. The gate is
      # scoped to production locales, so work in progress in any other locale
      # never stops a publish.
      # A metadata catalog (locales/<locale>/metadata/<repo>.json) is checked
      # against the English in THAT repo, so each repo some locale holds a catalog
      # for is fetched too: trees only, plus the few blobs the catalog is built
      # from. A repo that cannot be fetched leaves its catalogs `unv` (unverified),
      # which is reported and does not fail the run.
      - name: Fetch the repos metadata catalogs translate
        id: repos
        run: |
          set -euo pipefail
          REPOS=""
          for name in $(ls locales/*/metadata/*.json 2>/dev/null | grep -v '\.meta\.json$' | xargs -n1 basename 2>/dev/null | sed 's/\.json$//' | sort -u); do
            [[ "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || continue
            case "$name" in
              problem-specifications|docs|blog) node scripts/source-checkout.mjs --source="$name" || continue ;;
              *) node scripts/source-checkout.mjs --source=track --repo="exercism/$name" || continue ;;
            esac
            REPOS="${REPOS:+$REPOS,}.source/$name"
          done
          echo "list=$REPOS" >> "$GITHUB_OUTPUT"

      - name: Validate
        env:
          CONTENT_REPOS: ${{ steps.repos.outputs.list }}
        run: node scripts/validate.mjs all ${CONTENT_REPOS:+--content-repos="$CONTENT_REPOS"}

      # Catalogs are always rebuilt (they are two files per locale). Content is
      # narrowed to what this push changed when the previous commit is known: the
      # store will hold hundreds of thousands of files, and re-uploading all of
      # them on every push is the difference between seconds and an hour.
      - name: Build
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            node scripts/publish.mjs all --changed-since="$BEFORE"
          else
            node scripts/publish.mjs all
          fi

      - name: Keep the built tree
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

      # Artifacts first, content second, pointers LAST: dist/sync.sh has the
      # order and the reasons.
      - name: Upload to S3
        if: ${{ vars.I18N_BUCKET != '' }}
        env:
          EXERCISM_I18N_BUCKET: ${{ vars.I18N_BUCKET }}
          # TODO(iHiD): credentials. See the header.
        run: bash dist/sync.sh

      - name: Coverage
        if: always()
        run: node scripts/coverage.mjs
